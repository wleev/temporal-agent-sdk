name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain (Go + golangci-lint, pinned in mise.toml)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: go vet
        run: mise run vet

      - name: golangci-lint
        run: mise run lint

      - name: workflowcheck (temporal determinism)
        run: mise run workflowcheck

      - name: test
        run: mise run test
