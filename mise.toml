# Development toolchain and task runner for temporal-agent-sdk.
#
#   mise install          # install Go + golangci-lint + prek at pinned versions
#   mise run hooks        # install the prek git pre-commit hook
#   mise run test         # full test suite
#   mise run lint         # golangci-lint
#   mise run check        # vet + lint + workflowcheck + test

[tools]
go = "1.26.2"
golangci-lint = "2"
prek = "latest"

[tasks.test]
description = "Run the full test suite (includes dev-server e2e)"
run = "go test ./..."

[tasks.test-short]
description = "Run tests without the dev-server e2e (fast)"
run = "go test -short ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format code and tidy modules"
run = ["gofmt -w .", "go mod tidy"]

[tasks.vet]
description = "go vet"
run = "go vet ./..."

[tasks.workflowcheck]
description = "Temporal determinism check on workflow code"
run = "go tool workflowcheck ./..."

[tasks.hooks]
description = "Install the prek git pre-commit hook"
run = "prek install"

[tasks.check]
description = "Everything CI runs: vet, lint, workflowcheck, tests"
depends = ["vet", "lint", "workflowcheck", "test"]
